<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0d">
  <meta name="description" content="Four sides. Four little meanings. A birthday gift for Catherine.">
  <title>For Catherine</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23100e0d'/%3E%3Crect x='13' y='5' width='6' height='22' rx='1' fill='%23c4937e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=pendant-details-7">
  <script src="script.js?v=pendant-details-7" defer></script>
</head>
<body>
  <main id="experience" data-state="closed">
    <button id="opening" class="opening" aria-label="Open your birthday gift">
      <span class="opening-rule" aria-hidden="true"></span>
      <span id="dedication" class="dedication"></span>
      <span id="open-label" class="eyebrow"></span>
    </button>
    <button id="sound" class="quiet-control sound" hidden aria-pressed="false">Sound off</button>
    <div class="jewel-stage" aria-hidden="true" hidden>
      <div class="halo"></div>
      <div class="pendant-wrap">
        <div class="suspension"></div>
        <div class="bail"></div>
        <div id="pendant" class="pendant">
        <div class="face front"><span></span><i class="diamond" aria-hidden="true"></i></div>
        <div class="face back"><span></span></div>
        <div class="face right"><span></span></div>
        <div class="face left"><span></span></div>
        <div class="cap"></div>
      </div></div>
    </div>
    <section id="chapter" class="chapter" aria-live="polite" aria-atomic="true">
      <h1 id="engraving"></h1><p id="message" class="message"></p>
    </section>
    <button id="advance" class="advance" hidden aria-label="Tap to continue"></button>
    <p id="tap-hint" class="tap-hint" aria-hidden="true"></p>
    <button id="replay" class="quiet-control replay" hidden>Replay</button>
    <div id="progress" class="progress" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <noscript><p class="no-script">Happy Birthday Catherine. Please enable JavaScript to open your gift.</p></noscript>
  </main>
</body>
</html>
