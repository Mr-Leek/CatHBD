<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100e0d">
  <meta name="description" content="Four sides. Four little meanings. A birthday gift for Catherine.">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <title>For Catherine</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23100e0d'/%3E%3Crect x='13' y='5' width='6' height='22' rx='1' fill='%23c4937e'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="assets/photos/memory-01.jpg">
  <link rel="stylesheet" href="style.css?v=password-preview-1">
  <script src="script.js?v=password-preview-1" defer></script>
</head>
<body>
  <section id="password-gate" class="password-gate" aria-labelledby="gift-title">
    <form id="unlock-form" class="unlock-form" autocomplete="off" novalidate>
      <p class="eyebrow gate-dedication">FOR CATHERINE</p>
      <span class="opening-rule" aria-hidden="true"></span>
      <h1 id="gift-title">A Little Something For You</h1>
      <p id="gate-prompt" class="gate-prompt">Enter the secret password to open your gift.</p>
      <label for="gift-password">Secret password</label>
      <input id="gift-password" type="password" inputmode="numeric" enterkeyhint="go" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-describedby="gate-prompt password-error">
      <button id="unlock-gift" type="submit">Unlock My Gift</button>
      <p id="password-error" class="password-error" role="alert" aria-live="polite"></p>
    </form>
  </section>
  <main id="experience" data-state="closed" inert aria-hidden="true">
    <button id="opening" class="opening" aria-label="Open your birthday gift">
      <span class="opening-rule" aria-hidden="true"></span>
      <span id="dedication" class="dedication"></span>
      <span id="open-label" class="eyebrow"></span>
    </button>
    <button id="sound" class="quiet-control sound" hidden aria-pressed="false">Sound off</button>
    <button id="pause" class="quiet-control pause" hidden aria-pressed="false">Pause</button>
    <section id="cinema" class="cinema" hidden aria-label="Our birthday story">
      <div id="photo-stage" class="photo-stage" hidden>
        <figure class="photo-layer"><img alt=""><figcaption hidden></figcaption></figure>
        <figure class="photo-layer"><img alt=""><figcaption hidden></figcaption></figure>
      </div>
      <div id="story-copy" class="story-copy" aria-live="polite" aria-atomic="true"></div>
    </section>
    <div class="jewel-stage" aria-hidden="true" hidden>
      <div class="halo"></div>
      <div class="pendant-wrap">
        <div class="suspension"></div>
        <div class="bail"></div>
        <div id="pendant" class="pendant">
        <div class="face front"><span></span><i class="diamond" aria-hidden="true"></i></div>
        <div class="face back"><span></span></div>
        <div class="face right"><span></span></div>
        <div class="face left"><span></span></div>
        <div class="cap"></div>
      </div></div>
    </div>
    <section id="chapter" class="chapter" aria-live="polite" aria-atomic="true">
      <h1 id="engraving"></h1><p id="message" class="message"></p>
    </section>
    <button id="advance" class="advance" hidden aria-label="Tap to continue"></button>
    <p id="tap-hint" class="tap-hint" aria-hidden="true"></p>
    <button id="replay" class="quiet-control replay" hidden>Replay</button>
    <div id="progress" class="progress" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <noscript><p class="no-script">Happy Birthday Catherine. Please enable JavaScript to open your gift.</p></noscript>
  </main>
</body>
</html>
